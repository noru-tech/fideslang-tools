# Publish fideslang-cli to crates.io with Trusted Publishing (OIDC): no long-lived API token is
# stored in this repository.
#
# Bootstrapping: crates.io only accepts a trusted publisher for a crate that already exists, so
# the FIRST publish is done by hand by a maintainer (`cargo publish --locked` with a personal
# token). Afterwards, configure trusted publishing on crates.io (crate Settings -> Trusted
# Publishing: owner noru-tech, repository fideslang-tools, workflow publish-crate.yml) and delete
# the personal token. From then on this workflow publishes every release.
#
# Note: dist creates the GitHub Release with GITHUB_TOKEN, and events raised by GITHUB_TOKEN do not
# start other workflows, so `release: published` fires only for releases a person publishes. For
# dist-created releases, run this workflow by hand (Actions -> publish-crate -> Run workflow) and
# select the release tag as the ref.
name: publish-crate

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
